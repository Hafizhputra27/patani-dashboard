name: Auto Refresh Data from Pipeline

on:
  schedule:
    # Berjalan tiap hari jam 00:30 UTC = 07:30 WIB (setelah pipeline example_scrap selesai jam 06:00 WIB)
    - cron: "30 0 * * *"
  workflow_dispatch: # Tombol pemicu manual di tab GitHub Actions

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    env:
      SCRAP_TOKEN: ${{ secrets.SCRAP_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JSON terbaru dari repo example_scrap
        run: |
          set -e
          BASE_URL="https://raw.githubusercontent.com/Hafizhputra27/example_scrap/main/dashboard_data"
          FILES=("backtest.json" "band.json" "cuaca.json" "harga.json" "kurs.json" "meta.json" "prediksi.json" "riset.json")

          for f in "${FILES[@]}"; do
            echo "Mengunduh ${f}..."
            curl -fsSL -H "Authorization: Bearer ${SCRAP_TOKEN}" "${BASE_URL}/${f}" -o "public/data/${f}"
            cp "public/data/${f}" "dashboard_data/${f}"
          done

      - name: Validasi integritas JSON
        run: |
          node -e '
            const fs = require("fs");
            const files = ["backtest.json", "band.json", "cuaca.json", "harga.json", "kurs.json", "meta.json", "prediksi.json", "riset.json"];
            for (const f of files) {
              const data = fs.readFileSync("public/data/" + f, "utf-8");
              JSON.parse(data);
            }
            console.log("Semua 8 file JSON valid.");
          '

      - name: Commit dan Push pembaruan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json dashboard_data/*.json
          if git diff --staged --quiet; then
            echo "Data sudah yang paling baru. Tidak ada commit baru."
          else
            git commit -m "chore(data): auto-refresh data dari pipeline $(date -u +%F)"
            git push
          fi
